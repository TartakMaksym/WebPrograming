<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мій простір</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: 'Manrope', sans-serif;
    color: #f4f5ff;
    background:
        radial-gradient(ellipse at 15% 10%, #292653, transparent 40%),
        radial-gradient(ellipse at 90% 90%, #1b3047, transparent 35%),
        #0a0d18;
}

.container {
    width: 90%;
    max-width: 850px;
    margin: auto;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 0;
    border-bottom: 1px solid #ffffff18;
}

.logo {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 2px;
}


main {
    padding: 90px 0;
}

.subtitle {
    color: #a99cff;
    font-size: 11px;
    letter-spacing: 3px;
    margin-bottom: 18px;
}

h1 {
    font-size: clamp(36px, 5vw, 60px);
    line-height: 1.15;
    margin-bottom: 20px;
}

h1 span {
    color: #a99cff;
}

.links {
    display: grid;
    gap: 12px;
}

.links a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 22px;
    border: 1px solid #ffffff18;
    border-radius: 15px;
    background: #ffffff08;
    text-decoration: none;
    color: #f4f5ff;
    transition: 0.25s;
}

.links a:hover {
    transform: translateX(5px);
    background: #a99cff18;
    border-color: #a99cff;
}

.number {
    color: #a99cff;
    font-size: 12px;
    font-weight: bold;
}

.link-name {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
}

.arrow {
    font-size: 20px;
    color: #a99cff;
}


@media (max-width: 600px) {
    main {
        padding: 55px 0;
    }

    h1 {
        font-size: 40px;
    }

    footer {
        flex-direction: column;
    }
}
</style>
</head>

<body>
<div class="container">

    <header>
        <div class="logo">✦ Навігаційна сторінка</div>
    </header>

    <main>
        <section>

            <h1>Виберіть <span>лабораторну</span></h1>

            <nav class="links">
                <a href="https://tartakmaksym.github.io/WebPrograming/lab1/" target="_blank" rel="noopener noreferrer">
                    <span class="number">01</span>
                    <span class="link-name">Лабораторна №1</span>
                    <span class="arrow">↗</span>
                </a>

                <a href="https://tartakmaksym.github.io/WebPrograming/lab2/" target="_blank" rel="noopener noreferrer">
                    <span class="number">02</span>
                    <span class="link-name">Лабораторна №2</span>
                    <span class="arrow">↗</span>
                </a>

                <a href="https://tartakmaksym.github.io/WebPrograming/lab3/" target="_blank" rel="noopener noreferrer">
                    <span class="number">03</span>
                    <span class="link-name">Лабораторна №3</span>
                    <span class="arrow">↗</span>
                </a>

                <a href="https://tartakmaksym.github.io/WebPrograming/lab4/" target="_blank" rel="noopener noreferrer">
                    <span class="number">04</span>
                    <span class="link-name">Лабораторна №4</span>
                    <span class="arrow">↗</span>
                </a>
            </nav>
        </section>
    </main>
</div>
</body>
</html>
