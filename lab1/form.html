<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Запропонувати місто</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:auto;padding:20px;line-height:1.6;background:#f5f7fa;color:#222}header,main,footer{background:white;padding:22px;margin-bottom:18px;border-radius:12px}nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}nav a{padding:8px 12px;background:#e8eef5;border-radius:8px;text-decoration:none;color:#123}img{max-width:100%;border-radius:10px}article{margin:15px 0;padding:15px;background:#f0f3f6;border-radius:10px}label{display:block;margin-top:12px}input,select,textarea,button{width:100%;max-width:600px;padding:10px;margin-top:5px;box-sizing:border-box}button{cursor:pointer}</style></head><body><header><h1>Мої 3 найкращі міста світу</h1><nav>
